name: Profil

# Régénère les stats (assets/generated/) et le serpent chaque nuit.
# Secret optionnel PROFILE_TOKEN : un token classique avec les scopes `repo` et `read:user`
# pour compter aussi les dépôts privés. Sans lui, seules les données publiques sont lues.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer les cartes
        run: node scripts/generate-stats.mjs ${{ github.repository_owner }}
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Commiter si ça a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || (git commit -m "stats: mise à jour" && git pull --rebase && git push)

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # couleurs de la DA : la rampe violette du calendrier
          outputs: |
            dist/snake-dark.svg?color_snake=#9b7dff&color_dots=#1d1a23,#2e2450,#4b3a8f,#7458d6,#b3a0ff
            dist/snake-light.svg?color_snake=#7c5cff&color_dots=#e9e6ea,#d9ceff,#ae98ff,#7c5cff,#4a2fc4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
